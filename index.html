<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#100c12"><title>13일의 금요일 | 생존 심리 테스트</title><meta name="description" content="5가지 선택으로 알아보는 나의 공포영화 생존 유형"><style>:root{color-scheme:dark;font-family:system-ui,-apple-system,'Apple SD Gothic Neo',sans-serif}*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:radial-gradient(ellipse at 50% 0%,#401720 0%,#150e17 48%,#09090d 100%);color:#f8edf0}main{max-width:520px;margin:auto;padding:32px 20px 48px}.card{background:#1e1720ed;border:1px solid #51303b;border-radius:22px;padding:26px 22px;box-shadow:0 16px 60px #0006}.eyebrow{color:#ef9da7;font-size:12px;font-weight:800;letter-spacing:3px}h1{font-size:clamp(30px,8vw,45px);line-height:1.15;margin:12px 0 16px}h2{font-size:25px;line-height:1.35}p{line-height:1.75;color:#dbcbd0}.moon{font-size:75px;text-align:center;margin:28px 0;filter:drop-shadow(0 0 25px #d34c5a)}button{font:inherit;cursor:pointer}button.primary{width:100%;border:0;border-radius:14px;padding:17px 14px;color:white;font-weight:800;background:linear-gradient(120deg,#a51e35,#d83e4f);margin-top:16px}button.secondary{width:100%;border:1px solid #76525b;background:#30232c;color:white;border-radius:14px;padding:15px;margin-top:12px}.choice{width:100%;text-align:left;border:1px solid #60404b;background:#2b202a;color:#fff;border-radius:13px;padding:17px 14px;margin:7px 0;line-height:1.5}.choice:active,.choice:hover{background:#57303b;border-color:#e16c7b}.progress{height:6px;background:#49303a;border-radius:10px;overflow:hidden;margin:20px 0}.bar{height:100%;background:#e33f55;transition:width .2s}.muted{font-size:13px;color:#bda8af}.center{text-align:center}.resultIcon{font-size:76px;margin:15px 0}.stat{font-size:42px;font-weight:900;color:#ff6e82}.hidden{display:none}.tag{display:inline-block;border:1px solid #87545f;border-radius:50px;padding:7px 12px;color:#ffadba;font-size:13px}.footer{font-size:12px;text-align:center;color:#8e7980;margin-top:25px}#shareCard{background:linear-gradient(155deg,#391923,#120d16);border:1px solid #aa5262;border-radius:18px;padding:24px;margin:20px 0;text-align:center}#shareCard h2{margin:8px 0}#shareCard .small{font-size:12px;letter-spacing:2px;color:#ffadba}#shareCard .stat{margin:8px 0}button:focus-visible{outline:3px solid #f6b4c0;outline-offset:3px}</style></head><body><main><section id="intro" class="card center"><div class="eyebrow">FRIDAY THE 13TH</div><div class="moon">🌕</div><h1>13일의 금요일<br>생존 테스트</h1><p>깊은 숲속의 폐쇄된 캠프장.<br>친구들이 하나둘 사라지기 시작한다.<br><strong>당신은 마지막까지 살아남을 수 있을까?</strong></p><div class="tag">5문항 · 약 1분 · 6가지 엔딩</div><button class="primary" onclick="start()">캠프장 입장하기 🔪</button></section><section id="quiz" class="card hidden"><div class="eyebrow">THE NIGHT BEGINS</div><div class="muted" id="step"></div><div class="progress"><div class="bar" id="bar"></div></div><h2 id="question"></h2><div id="choices"></div><button class="secondary" id="back" onclick="back()">← 이전 질문</button></section><section id="result" class="card hidden"><div class="eyebrow center">YOU SURVIVED... OR DID YOU?</div><div id="shareCard"><div class="small">13일의 금요일 · 생존 심리 테스트</div><div class="resultIcon" id="resultIcon"></div><h2 id="resultTitle"></h2><div class="muted">공포영화 속 가상의 생존 확률</div><div class="stat" id="resultStat"></div><p id="resultDesc"></p><div class="small">당신의 선택이 엔딩을 만들었다.</div></div><button class="primary" onclick="shareResult()">결과 공유하기 📤</button><button class="secondary" onclick="saveImage()">결과 카드 이미지 저장하기 🖼️</button><button class="secondary" onclick="restart()">다시 도전하기 ↻</button><p class="muted center">※ 재미를 위한 창작 테스트이며 실제 심리 진단이나 통계가 아닙니다.</p></section><div class="footer">13일의 금요일 · 친구들과 함께 즐기는 공포 테스트</div></main><script>const qs=[['캠프장 밖에서 비명소리가 들린다. 당신의 행동은?',['친구들과 함께 확인하러 간다','문을 잠그고 조용히 기다린다','무기가 될 만한 물건부터 찾는다','창문으로 밖을 살펴본다']],['친구 한 명이 사라졌다. 어디부터 찾을까?',['마지막으로 목격된 장소','안전한 곳에서 연락을 시도한다','주변에 남겨진 흔적을 조사한다','다른 친구들을 모아 수색한다']],['복도 끝에 정체불명의 그림자가 보인다!',['소리를 지르며 도망간다','숨을 죽이고 몸을 숨긴다','손에 든 물건으로 맞설 준비를 한다','그림자의 움직임을 관찰한다']],['탈출용 자동차의 열쇠를 발견했다. 그런데 친구가 보이지 않는다.',['친구를 찾으러 돌아간다','우선 차에 타서 탈출한다','차를 준비해두고 친구를 기다린다','차가 함정인지 먼저 확인한다']],['드디어 살인마와 마주쳤다! 마지막 선택은?',['친구를 지키며 함께 탈출한다','틈을 노려 혼자 빠져나간다','주변 물건을 이용해 반격한다','살인마를 속여 다른 방향으로 유인한다']]];const endings=[['🩸','희생적인 주인공',55,'친구를 두고 도망치지 못하는 타입. 영화의 진짜 주인공이지만 남을 구하러 돌아가는 선택이 가장 위험할 수도 있어.'],['🦊','냉철한 생존자',90,'위험한 상황에서 감정보다 생존을 우선하는 현실주의자. 모두가 패닉에 빠져도 탈출 방법부터 찾아.'],['🪓','살인마의 천적',70,'도망만 치지는 않는 행동파. 무서워도 맞설 준비를 하고 위기에서는 오히려 대담해져.'],['👁️','숨겨진 흑막 후보',85,'남들이 비명을 지를 때 혼자 상황을 분석하는 관찰자. 너무 침착해서 오히려 친구들이 당신을 의심할지도?'],['💀','첫 번째 희생자',15,'본능적으로 행동하다가 예상치 못한 위험에 휘말리는 타입. 그래도 공포영화에서 가장 기억에 남는 장면의 주인공!'],['🌙','최후의 생존자',95,'용기와 신중함을 적절히 조절하는 타입. 협력하면서도 함정을 경계하는 엔딩의 주인공.']];let answers=[],idx=0,outcome=0;const el=id=>document.getElementById(id);function show(id){['intro','quiz','result'].forEach(x=>el(x).classList.toggle('hidden',x!==id));window.scrollTo(0,0)}function start(){answers=[];idx=0;render();show('quiz')}function render(){el('step').textContent=`QUESTION ${idx+1} / ${qs.length}`;el('bar').style.width=`${idx/qs.length*100}%`;el('question').textContent=qs[idx][0];el('choices').replaceChildren();qs[idx][1].forEach((s,i)=>{const b=document.createElement('button');b.className='choice';b.textContent='ABCD'[i]+'. '+s;b.onclick=()=>pick(i);el('choices').append(b)});el('back').style.display=idx?'block':'none'}function pick(v){answers[idx]=v;if(idx<4){idx++;render()}else finish()}function back(){if(idx){idx--;render()}}function finish(){let counts=[0,1,2,3].map(n=>answers.filter(x=>x===n).length),max=Math.max(...counts);outcome=max>=3?counts.indexOf(max):new Set(answers).size===4?5:4;let e=endings[outcome];el('resultIcon').textContent=e[0];el('resultTitle').textContent=e[1];el('resultStat').textContent=e[2]+'%';el('resultDesc').textContent=e[3];show('result')}function restart(){start()}function resultText(){let e=endings[outcome];return `🔪 13일의 금요일 생존 테스트\n${e[0]} 나의 유형: ${e[1]}\n가상의 생존 확률: ${e[2]}%\n${e[3]}\n너도 도전해봐! ${location.protocol==='file:'?'':location.href}`}async function shareResult(){const txt=resultText();if(navigator.share){try{await navigator.share({title:'13일의 금요일 생존 테스트',text:txt});return}catch(e){if(e.name==='AbortError')return}}try{await navigator.clipboard.writeText(txt);alert('결과를 복사했어요! 단톡방에 붙여넣어 주세요.')}catch(e){prompt('결과를 복사해 주세요:',txt)}}function saveImage(){const e=endings[outcome],c=document.createElement('canvas');c.width=1080;c.height=1350;const x=c.getContext('2d'),g=x.createLinearGradient(0,0,1080,1350);g.addColorStop(0,'#421b29');g.addColorStop(1,'#0d0b13');x.fillStyle=g;x.fillRect(0,0,1080,1350);x.strokeStyle='#a94e63';x.lineWidth=5;x.strokeRect(45,45,990,1260);x.textAlign='center';x.fillStyle='#ffb2bf';x.font='bold 34px sans-serif';x.fillText('FRIDAY THE 13TH',540,155);x.font='170px sans-serif';x.fillText(e[0],540,430);x.fillStyle='white';x.font='bold 70px sans-serif';x.fillText(e[1],540,555);x.fillStyle='#d9c2ca';x.font='32px sans-serif';x.fillText('공포영화 속 가상의 생존 확률',540,650);x.fillStyle='#ff7288';x.font='bold 120px sans-serif';x.fillText(e[2]+'%',540,790);x.fillStyle='#f4e6eb';x.font='31px sans-serif';const lines=wrap(x,e[3],840);lines.forEach((l,i)=>x.fillText(l,540,910+i*53));x.fillStyle='#f2a2b0';x.font='26px sans-serif';x.fillText('13일의 금요일 · 생존 심리 테스트',540,1220);const a=document.createElement('a');a.download='friday13-result.png';a.href=c.toDataURL('image/png');a.click()}function wrap(ctx,s,w){let lines=[],line='';for(const word of s.split(' ')){let t=line?line+' '+word:word;if(ctx.measureText(t).width>w){if(line)lines.push(line);line=word}else line=t}if(line)lines.push(line);return lines}</script></body></html>
